aid: election-org
name: Election.org Public Data API
image: https://election.org/og.png
description: Election.org Public Data API provides free, anonymous access to a wide range of civic election data, including linked civic JSON
  datasets and federal CSV files. Users can retrieve information on candidates, results, campaign finance, and more, supporting public insight
  and research without requiring authentication or payment.
