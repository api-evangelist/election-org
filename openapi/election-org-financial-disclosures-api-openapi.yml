openapi: 3.2.0
info:
  title: Election.org Public Data Financial Disclosures API
  version: '2026-09-12'
  description: Source-first public election data. Public beta coverage is explicit; null and omitted values are never silently converted to zeroes or inferred facts.
  contact:
    email: data@election.org
servers:
- url: https://election.org/api/v1
tags:
- name: Financial Disclosures
paths:
  /financial-disclosures:
    get:
      summary: Search official U.S. House financial-disclosure filing indexes
      description: Returns filing-level Clerk index records and direct official PDFs. The index alone does not expose transactions; separately validated digital PTR rows are available from /stock-trades. A filing is not evidence of wrongdoing, intent, profit, loss, or conflict.
      parameters:
      - name: q
        in: query
        description: Filer name, House district, or document ID.
        schema:
          type: string
          maxLength: 100
      - name: year
        in: query
        schema:
          type: integer
          enum:
          - 2024
          - 2025
          - 2026
      - name: state
        in: query
        required: false
        description: Two-letter postal abbreviation.
        schema:
          type: string
          minLength: 2
          maxLength: 2
      - name: district
        in: query
        schema:
          type: string
      - name: type
        in: query
        description: Exact Clerk filing code. Code P is a Periodic Transaction Report.
        schema:
          type: string
          maxLength: 1
      - name: ptr
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 250
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Official House Clerk filing-index records, source fingerprints, anomaly counts, and evidence boundaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataResponse'
      tags:
      - Financial Disclosures
      operationId: getFinancialDisclosures
      x-operation-id-source: derived
components:
  schemas:
    Citation:
      type: object
      description: Suggested attribution, not a forced backlink or new license. Collection sources are not necessarily evidence for every returned record. Dates are not request generation times.
      required:
      - suggested_credit
      - record_url
      - record_urls
      - credit_url
      - original_sources
      - updated_at
      - verified_at
      - guidance_url
      - rights_note
      properties:
        suggested_credit:
          type: string
        record_url:
          type:
          - string
          - 'null'
          format: uri
        record_urls:
          type: array
          items:
            type: string
            format: uri
        credit_url:
          type: string
          format: uri
        original_sources:
          type: array
          description: 'Returned-data source references. References explicitly marked applies_to_returned_records: false remain in response sources but are excluded here.'
          items:
            type: object
            properties:
              name:
                type: string
              url:
                type: string
                format: uri
              updated_at:
                type:
                - string
                - 'null'
              verified_at:
                type:
                - string
                - 'null'
              record_date:
                type:
                - string
                - 'null'
                description: Date on the cited record, not a source check or dataset update
        updated_at:
          type:
          - string
          - 'null'
          description: Explicit dataset update date, or null when unspecified
        verified_at:
          type:
          - string
          - 'null'
          description: Latest stated source check; does not establish freshness of every record
        dates_note:
          type: string
        source_scope:
          type: string
        source_summary_truncated:
          type: boolean
        guidance_url:
          type: string
          format: uri
        rights_note:
          type: string
    PublicDataResponse:
      type: object
      required:
      - data
      - citation
      properties:
        data: {}
        citation:
          $ref: '#/components/schemas/Citation'
      additionalProperties: true
externalDocs:
  description: Citation and reuse guidance
  url: https://election.org/data/api#attribution
