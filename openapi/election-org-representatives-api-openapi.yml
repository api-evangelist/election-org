openapi: 3.2.0
info:
  title: Election.org Public Data Representatives API
  version: '2026-09-12'
  description: Source-first public election data. Public beta coverage is explicit; null and omitted values are never silently converted to zeroes or inferred facts.
  contact:
    email: data@election.org
servers:
- url: https://election.org/api/v1
tags:
- name: Representatives
paths:
  /representatives:
    get:
      summary: Return sourced current officeholders
      parameters:
      - name: address
        in: query
        required: true
        description: U.S. street address or 5-digit ZIP. ZIP results are approximate.
        schema:
          type: string
          minLength: 5
          maxLength: 120
      responses:
        '200':
          description: Grouped representative, government-entity, exact school-system profile, and honest office-shell records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataResponse'
        '400':
          description: Required location input is missing or invalid
        '422':
          description: Location is unmatched or ambiguous; error.retryable=false. This does not describe a provider outage.
        '500':
          description: Lookup could not be completed; no result or empty coverage should be inferred. Private, no-store response.
        '503':
          description: Upstream location service is unavailable; error.code=lookup_unavailable, error.retryable=true. Retry later; do not downgrade to ZIP or infer no match.
        '504':
          description: The bounded location-service wait timed out; error.code=lookup_timeout, error.retryable=true. Retry later. Private, no-store response.
      tags:
      - Representatives
      operationId: getRepresentatives
      x-operation-id-source: derived
components:
  schemas:
    Citation:
      type: object
      description: Suggested attribution, not a forced backlink or new license. Collection sources are not necessarily evidence for every returned record. Dates are not request generation times.
      required:
      - suggested_credit
      - record_url
      - record_urls
      - credit_url
      - original_sources
      - updated_at
      - verified_at
      - guidance_url
      - rights_note
      properties:
        suggested_credit:
          type: string
        record_url:
          type:
          - string
          - 'null'
          format: uri
        record_urls:
          type: array
          items:
            type: string
            format: uri
        credit_url:
          type: string
          format: uri
        original_sources:
          type: array
          description: 'Returned-data source references. References explicitly marked applies_to_returned_records: false remain in response sources but are excluded here.'
          items:
            type: object
            properties:
              name:
                type: string
              url:
                type: string
                format: uri
              updated_at:
                type:
                - string
                - 'null'
              verified_at:
                type:
                - string
                - 'null'
              record_date:
                type:
                - string
                - 'null'
                description: Date on the cited record, not a source check or dataset update
        updated_at:
          type:
          - string
          - 'null'
          description: Explicit dataset update date, or null when unspecified
        verified_at:
          type:
          - string
          - 'null'
          description: Latest stated source check; does not establish freshness of every record
        dates_note:
          type: string
        source_scope:
          type: string
        source_summary_truncated:
          type: boolean
        guidance_url:
          type: string
          format: uri
        rights_note:
          type: string
    PublicDataResponse:
      type: object
      required:
      - data
      - citation
      properties:
        data: {}
        citation:
          $ref: '#/components/schemas/Citation'
      additionalProperties: true
externalDocs:
  description: Citation and reuse guidance
  url: https://election.org/data/api#attribution
