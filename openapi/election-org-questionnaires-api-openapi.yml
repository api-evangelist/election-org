openapi: 3.2.0
info:
  title: Election.org Public Data Questionnaires API
  version: '2026-09-12'
  description: Source-first public election data. Public beta coverage is explicit; null and omitted values are never silently converted to zeroes or inferred facts.
  contact:
    email: data@election.org
servers:
- url: https://election.org/api/v1
tags:
- name: Questionnaires
paths:
  /questionnaires:
    get:
      summary: Search uniform candidate questionnaires and verified-response status
      description: Returns the same eight questions for connected federal and official local candidate records. No published response or recorded invitation never implies refusal, nonparticipation, or a policy position.
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
      - name: candidate_id
        in: query
        schema:
          type: string
      - name: record_id
        in: query
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: Two-letter postal abbreviation.
        schema:
          type: string
          minLength: 2
          maxLength: 2
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - federal
          - local
      - name: status
        in: query
        schema:
          type: string
          enum:
          - no_verified_election_org_response_published
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 250
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Question schema, candidate response pages, current verified-response and invitation status, sources, and publication boundaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataResponse'
        '422':
          description: Invalid filter
      tags:
      - Questionnaires
      operationId: getQuestionnaires
      x-operation-id-source: derived
components:
  schemas:
    Citation:
      type: object
      description: Suggested attribution, not a forced backlink or new license. Collection sources are not necessarily evidence for every returned record. Dates are not request generation times.
      required:
      - suggested_credit
      - record_url
      - record_urls
      - credit_url
      - original_sources
      - updated_at
      - verified_at
      - guidance_url
      - rights_note
      properties:
        suggested_credit:
          type: string
        record_url:
          type:
          - string
          - 'null'
          format: uri
        record_urls:
          type: array
          items:
            type: string
            format: uri
        credit_url:
          type: string
          format: uri
        original_sources:
          type: array
          description: 'Returned-data source references. References explicitly marked applies_to_returned_records: false remain in response sources but are excluded here.'
          items:
            type: object
            properties:
              name:
                type: string
              url:
                type: string
                format: uri
              updated_at:
                type:
                - string
                - 'null'
              verified_at:
                type:
                - string
                - 'null'
              record_date:
                type:
                - string
                - 'null'
                description: Date on the cited record, not a source check or dataset update
        updated_at:
          type:
          - string
          - 'null'
          description: Explicit dataset update date, or null when unspecified
        verified_at:
          type:
          - string
          - 'null'
          description: Latest stated source check; does not establish freshness of every record
        dates_note:
          type: string
        source_scope:
          type: string
        source_summary_truncated:
          type: boolean
        guidance_url:
          type: string
          format: uri
        rights_note:
          type: string
    PublicDataResponse:
      type: object
      required:
      - data
      - citation
      properties:
        data: {}
        citation:
          $ref: '#/components/schemas/Citation'
      additionalProperties: true
externalDocs:
  description: Citation and reuse guidance
  url: https://election.org/data/api#attribution
