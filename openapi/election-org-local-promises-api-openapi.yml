openapi: 3.2.0
info:
  title: Election.org Public Data Local Promises API
  version: '2026-09-12'
  description: Source-first public election data. Public beta coverage is explicit; null and omitted values are never silently converted to zeroes or inferred facts.
  contact:
    email: data@election.org
servers:
- url: https://election.org/api/v1
tags:
- name: Local Promises
paths:
  /local-promises:
    get:
      summary: Search evidence-first Los Angeles campaign promise timelines
      description: Each record connects a precise campaign commitment to dated public actions or current official measures. Statuses describe only the narrowest source-supported action and never mean kept, broken, truthful, effective, or caused by the officeholder.
      parameters:
      - name: person
        in: query
        description: Person ID, slug, or name fragment.
        schema:
          type: string
      - name: topic
        in: query
        description: Canonical topic ID or label fragment.
        schema:
          type: string
      - name: status
        in: query
        description: Exact evidence-status code.
        schema:
          type: string
          enum:
          - action_completed
          - official_reporting_says_threshold_exceeded
          - target_not_reached_as_of_source
      responses:
        '200':
          description: Commitments, evidence statuses, dated timelines, excerpts, retrieval metadata, SHA-256 source fingerprints, and explicit verdict and coverage limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataResponse'
      tags:
      - Local Promises
      operationId: getLocalPromises
      x-operation-id-source: derived
components:
  schemas:
    Citation:
      type: object
      description: Suggested attribution, not a forced backlink or new license. Collection sources are not necessarily evidence for every returned record. Dates are not request generation times.
      required:
      - suggested_credit
      - record_url
      - record_urls
      - credit_url
      - original_sources
      - updated_at
      - verified_at
      - guidance_url
      - rights_note
      properties:
        suggested_credit:
          type: string
        record_url:
          type:
          - string
          - 'null'
          format: uri
        record_urls:
          type: array
          items:
            type: string
            format: uri
        credit_url:
          type: string
          format: uri
        original_sources:
          type: array
          description: 'Returned-data source references. References explicitly marked applies_to_returned_records: false remain in response sources but are excluded here.'
          items:
            type: object
            properties:
              name:
                type: string
              url:
                type: string
                format: uri
              updated_at:
                type:
                - string
                - 'null'
              verified_at:
                type:
                - string
                - 'null'
              record_date:
                type:
                - string
                - 'null'
                description: Date on the cited record, not a source check or dataset update
        updated_at:
          type:
          - string
          - 'null'
          description: Explicit dataset update date, or null when unspecified
        verified_at:
          type:
          - string
          - 'null'
          description: Latest stated source check; does not establish freshness of every record
        dates_note:
          type: string
        source_scope:
          type: string
        source_summary_truncated:
          type: boolean
        guidance_url:
          type: string
          format: uri
        rights_note:
          type: string
    PublicDataResponse:
      type: object
      required:
      - data
      - citation
      properties:
        data: {}
        citation:
          $ref: '#/components/schemas/Citation'
      additionalProperties: true
externalDocs:
  description: Citation and reuse guidance
  url: https://election.org/data/api#attribution
